name: Secret Scan (gitleaks)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

      # 轻量兜底：即使 gitleaks 规则未覆盖，也阻断常见明文 token 私钥落库
      - name: Fallback regex guard (no binary needed)
        if: always()
        run: |
          set -euo pipefail
          echo "Running fallback secret guard..."
          # 扫描本次 push/PR 涉及的 diff（全历史兜底用 git log -p 也行，这里扫工作区）
          if grep -RInE \
            -e 'ghp_[A-Za-z0-9]{36,}' \
            -e 'gho_[A-Za-z0-9]{36,}' \
            -e 'github_pat_[A-Za-z0-9_]{80,}' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
            -e 'sk-(proj-)?[A-Za-z0-9_-]{20,}' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.wrangler \
            --exclude="*.toml" --exclude="pre-commit" \
            . 2>/dev/null | grep -v -E 'REPLACE_WITH|change-me|fill-real-salt|R_kgDO|DIC_kwDO|example|placeholder'; then
            echo "::error::Fallback guard detected possible secret pattern above. Remove it or add justified allowlist to .gitleaks.toml"
            exit 1
          fi
          echo "Fallback guard passed."
