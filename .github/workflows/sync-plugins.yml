name: Sync dsh Plugins & Update Wiki

on:
  schedule:
    # 每 1 小时自动同步一次并更新页面与 Wiki
    - cron: '0 * * * *'
  workflow_dispatch: # 支持在 GitHub Web 手动一键触发

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Fetch Plugins & Generate Data and Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync-plugins.js

      - name: Commit & Push plugins.json to Main Repo
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/plugins.json
          if git diff --staged --quiet; then
            echo "No changes in plugins.json"
          else
            git commit -m "chore(sync): update plugins.json from topic:dsh-plugin [skip ci]"
            git push origin HEAD
          fi

      - name: Deploy to GitHub Wiki
        env:
          ACTION_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cloning and updating repository wiki..."
          WIKI_URL="https://x-access-token:${ACTION_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          
          # 克隆 Wiki 仓库 (若未开启 Wiki 请先在仓库 Settings 开启并初始化一页)
          git clone $WIKI_URL wiki_repo || {
            echo "Wiki repo clone failed. Please ensure Wiki is initialized in repo settings."
            exit 0
          }
          
          cp -r wiki_dist/* wiki_repo/
          cd wiki_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "Wiki is already up to date."
          else
            git commit -m "docs(wiki): sync dsh plugins catalog [skip ci]"
            git push origin master || git push origin main
          fi
